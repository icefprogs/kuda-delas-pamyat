name: Windows build and release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Check installer compiler
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (!(Test-Path -LiteralPath $compiler) -and !(Get-Command ISCC.exe -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Validate and package
        shell: pwsh
        run: ./scripts/build.ps1 -Installer
      - uses: actions/upload-artifact@v7
        with:
          name: KudaDelasPamyat-windows-x64
          path: |
            artifacts/KudaDelasPamyat-*.zip
            artifacts/KudaDelasPamyat-*.exe
            artifacts/KudaDelasPamyat-*.sha256

  release:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    concurrency:
      group: disk-space-release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: KudaDelasPamyat-windows-x64
          path: release
      - name: Publish release if this version is new
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $project = [xml](Get-Content ./DiskSpace/DiskSpace.csproj -Raw)
          $tag = 'v' + $project.Project.PropertyGroup.Version
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { exit 0 }
          $assets = (Get-ChildItem release -File).FullName
          gh release create $tag @assets --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Куда делась память? $tag" --notes-file RELEASE_NOTES.md
          exit $LASTEXITCODE
